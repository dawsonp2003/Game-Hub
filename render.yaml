# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: game-arcade-signaling
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: game-arcade-web
    runtime: static
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SIGNALING_URL
        value: game-arcade-signaling.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
